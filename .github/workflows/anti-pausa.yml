name: Anti-pausa Supabase

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  mantener-activo:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar disponibilidad (mantiene la base de datos despierta)
        run: curl -fsS -m 30 -o /dev/null https://www.guzfalca.com/api/disponibilidad || curl -fsS -m 30 -o /dev/null https://njvxxqfiqlvphthlaqcd.supabase.co/auth/v1/health